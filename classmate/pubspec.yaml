publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.10.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^8.2.1
  shared_preferences: ^2.5.5
  flutter_local_notifications: ^22.3.1
  timezone: ^0.11.1
