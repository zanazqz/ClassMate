name: Build ClassMate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classmate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android

      - name: Configure Android desugaring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("android/app/build.gradle.kts")
          s = p.read_text()
          s = s.replace(
              "android {",
              """android {
    compileOptions {
        isCoreLibraryDesugaringEnabled = true
    }""",
              1,
          )
          s = s.replace(
              "dependencies {",
              """dependencies {
    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")""",
              1,
          )
          p.write_text(s)
          PY

      - name: Remove generated sample test
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassMate-APK
          path: classmate/build/app/outputs/flutter-apk/app-release.apk
