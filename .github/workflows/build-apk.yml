name: Build ClassMate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classmate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android --project-name classmate

      - name: Configure Android build
        shell: bash
        run: |
          set -euo pipefail

          python3 - <<'PY'
          from pathlib import Path

          p = Path("android/app/build.gradle.kts")
          s = p.read_text()

          # Enable Java 8+ API desugaring required by flutter_local_notifications.
          if "isCoreLibraryDesugaringEnabled = true" not in s:
              marker = "android {"
              if marker not in s:
                  raise SystemExit("android { block not found")
              s = s.replace(
                  marker,
                  marker + """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
                  isCoreLibraryDesugaringEnabled = true
              }
          """,
                  1,
              )

          dep = 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")'
          if dep not in s:
              marker = "dependencies {"
              if marker not in s:
                  s += "\n\ndependencies {\n    " + dep + "\n}\n"
              else:
                  s = s.replace(marker, marker + "\n    " + dep, 1)

          p.write_text(s)
          PY

          echo "----- android/app/build.gradle.kts -----"
          cat android/app/build.gradle.kts
          echo "----------------------------------------"

          grep -q 'coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' android/app/build.gradle.kts
          grep -q 'isCoreLibraryDesugaringEnabled = true' android/app/build.gradle.kts

      - name: Remove generated sample test
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassMate-APK
          path: classmate/build/app/outputs/flutter-apk/app-release.apk
