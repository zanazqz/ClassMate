name: Build ClassMate APK

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: classmate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android platform
        run: flutter create . --platforms=android

      - name: Configure Android desugaring
        shell: bash
        run: |
          if [ -f android/app/build.gradle.kts ]; then
            sed -i '/^android {/a\    compileOptions {\n        isCoreLibraryDesugaringEnabled = true\n    }' android/app/build.gradle.kts
            sed -i '/^dependencies {/a\    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.5")' android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i '/^android {/a\    compileOptions {\n        coreLibraryDesugaringEnabled true\n    }' android/app/build.gradle
            sed -i '/^dependencies {/a\    coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.5"' android/app/build.gradle
          else
            echo "Android app Gradle file not found"
            exit 1
          fi

      - name: Remove generated sample test
        run: rm -rf test

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ClassMate-APK
          path: classmate/build/app/outputs/flutter-apk/app-release.apk
